trigger:
  branches:
    include:
      - main

schedules:
  - cron: '0 */6 * * *'
    displayName: Scheduled sync
    branches:
      include:
        - main
    always: true

pool:
  name: Net7_Pool

variables:
  GITHUB_REPO_URL: 'https://$(GITHUB_PAT)@github.com/lina-love/sync-dummy.git'

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - script: |
      git config user.email "mahmoud.kinawy@iucon.com.eg"
      git config user.name  "mahmoud.kinawy"
    displayName: Configure git identity

  - script: |
      REM Create a proper local main branch from the remote-tracking ref
      git fetch origin main
      git checkout -B main origin/main

      git remote get-url github >nul 2>&1 && (
        git remote set-url github "$(GITHUB_REPO_URL)"
      ) || (
        git remote add github "$(GITHUB_REPO_URL)"
      )

      git push github main:main --force
    displayName: Mirror main to GitHub
    env:
      GITHUB_PAT: $(GITHUB_PAT)