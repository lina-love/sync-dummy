name: Sync from Azure DevOps

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror ADO to GitHub
        uses: wearerequired/git-mirror-action@v1
        env:
          GIT_USERNAME: ${{ secrets.ADO_USERNAME }}
          GIT_PASSWORD: ${{ secrets.ADO_PAT }}
        with:
          source-repo: "https://devops.iucon-dev.com/tfs/DefaultCollection/MANZ%20Website/_git/sync-dummy"
          destination-repo: "git@github.com:lina-love/sync-dummy.git"
