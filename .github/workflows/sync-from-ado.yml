name: Sync from Azure DevOps

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
        - uses: yesolutions/mirror-action@master
          with:
            REMOTE: 'https://devops.iucon-dev.com/tfs/DefaultCollection/MANZ%20Website/_git/sync-dummy'
            GIT_USERNAME: ${{ secrets.ADO_USERNAME }}
            GIT_PASSWORD: ${{ secrets.ADO_PAT }}
